<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/clear-list.css">
  <link rel="stylesheet" href="style/compound.css">
  <link rel="stylesheet" href="style/title.css">
  <link rel="stylesheet" href="style/card.css">
  <link rel="stylesheet" href="style/products.css">
  <link rel="stylesheet" href="style/container.css">
  <link rel="stylesheet" href="style/catalog.css">
</head>

<body>
  <main class="catalog ">
    <div class="catalog__container container" >

      <button class="container__button" id="repaint-all-cards">сменить цвет всех карточек</button>
      <button class="container__button" id="repaint-first-card">сменить цвет первой карточки</button>
      <button class="container__button" id="open-google">Открыть страницу Google.com</button>
      <button class="container__button" id="output-console-log">Вывести сообщение в консоль лог</button>

      <h1 class="title catalog__title">Выбери свой продукт</h1>
      <ul class="products clear-list " id="products-list"  >

        <template id="products-template">

          <li class="products__item card">
            <img class="card__image products-image" src="" alt=""/>
            <span class="card__category products-type" ></span>
            <h1 class="card__name products-name" ></h1>

            <div  class="card__description">
              <p class="products-effect"> </p>
            </div>

            <div class="card__compound compound">
              <span class="compaund__name products-composition" ></span>
              <ul class="compound__list">
                <li class="products-components1"></li>
                 <li class="products-components2"></li>
                <li class="products-components3"></li>
              </ul>
            </div>

            <div class="card__price">
              <b class="products-price"></b>
              <span class="products-priceTag"></span>
            </div>
          </li>

        </template>

      </ul>
    </div>
  </main>
  <script src="main.js"></script>
  <script src="homwork-7.js"></script>
  <script src="homwork-8.js"></script>
  <script type="module" src="homwork-9.js"></script>
  <script type="module" src="comments.js"></script>
  <script type="module" src="products.js"></script>
  <script type="module" src="homwork-10.js"></script>
</body>
</html>
